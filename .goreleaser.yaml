version: 2

project_name: nrllink

builds:
  - id: nrllink
    binary: nrllink
    env: [CGO_ENABLED=0]
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
  # OpenWrt 常见架构:armv7 和 riscv64(32 位 MIPS 不被纯 Go sqlite 驱动支持)
  - id: nrllink-linux-armv7
    binary: nrllink
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [arm]
    goarm: [7]
  - id: nrllink-linux-riscv64
    binary: nrllink
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [riscv64]

dockers:
  - image_templates:
      - "ghcr.io/hicaoc/nrllink:{{ .Version }}"
      - "ghcr.io/hicaoc/nrllink:latest"
    dockerfile: Dockerfile
    extra_files:
      - start.sh
    build_flag_templates:
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description=Radio over network.
      - --label=org.opencontainers.image.url=https://github.com/hicaoc/nrllink
      - --label=org.opencontainers.image.source=https://github.com/hicaoc/nrllink
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=MIT

nfpms:
  - maintainer: BH4RPN <caoc@live.com>
    description: Radio over network.
    homepage: https://github.com/hicaoc/nrllink
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: udphub.yaml
        dst: /nrllink/udphub.yaml
        type: config|noreplace
      - src: nrllink.service
        dst: /usr/lib/systemd/system/nrllink.service
    scripts:
      postinstall: scripts/postinstall.sh

