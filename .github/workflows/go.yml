name: Go

on:
  push:
    branches: [ sqlite ]
  pull_request:
    branches: [ sqlite ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

      - name: Build Windows and Linux binaries
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}
            out=dist/nrllink_${os}_${arch}
            if [ "$os" = windows ]; then out=$out.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o "$out" .
          done
          ls -lh dist/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nrllink-binaries
          path: dist/nrllink_*
          retention-days: 30
