name: Go

on:
  push:
    branches: [ sqlite ]
  pull_request:
    branches: [ sqlite ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

      - name: Build Windows and Linux binaries
        run: |
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64   go build -o dist/nrllink_linux_amd64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64   go build -o dist/nrllink_linux_arm64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm     GOARM=7 go build -o dist/nrllink_linux_armv7 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=riscv64 go build -o dist/nrllink_linux_riscv64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64   go build -o dist/nrllink_windows_amd64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64   go build -o dist/nrllink_windows_arm64.exe .
          ls -lh dist/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nrllink-binaries
          path: dist/nrllink_*
          retention-days: 30
