name: Go

on:
  push:
    branches: [ sqlite ]
  pull_request:
    branches: [ sqlite ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Checkout nrllink-web
        uses: actions/checkout@v4
        with:
          repository: hicaoc/nrllink-web
          path: web

      - name: Install Vite+ (vp)
        run: curl -fsSL https://vite.plus | bash

      - name: Build web console
        working-directory: web
        run: |
          export PATH="$HOME/.vite-plus/bin:$PATH"
          vp install
          vp build

      - name: Build snapshot (binaries + deb/rpm/apk)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries and packages
        uses: actions/upload-artifact@v4
        with:
          name: nrllink-binaries
          path: |
            dist/*.tar.gz
            dist/*.deb
          retention-days: 30
